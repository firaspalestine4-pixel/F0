<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><meta name="description" content="F0 — قطاع الطرق"><title>F0 | قطاع الطرق</title>
<link rel="icon" href="https://firaspalestine4-pixel.github.io/F0/logo.png">
<style>
:root{--red:#e50914;--red2:#ff343d;--bg:#050505;--line:#29292d;--text:#f5f5f5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}body{background:radial-gradient(circle at 50% -10%,rgba(229,9,20,.18),transparent 36rem),linear-gradient(145deg,#030303,#0a0102 48%,#030303)}button,input{font:inherit}button{cursor:pointer}.page{width:min(760px,100%);margin:auto;padding:18px}.logo{display:block;width:100%;max-width:560px;height:auto;margin:0 auto;object-fit:contain;object-position:center}.brand-card{position:relative;overflow:hidden;text-align:center;padding:14px 10px 22px;border:1px solid #26262a;border-radius:26px;background:linear-gradient(180deg,rgba(20,2,4,.94),rgba(7,7,8,.97));box-shadow:0 20px 70px rgba(0,0,0,.45)}.brand-card:after{content:"";position:absolute;inset:-80%;background:repeating-linear-gradient(115deg,transparent 0 25px,rgba(229,9,20,.035) 26px 27px);transform:rotate(6deg);pointer-events:none}.tag{position:relative;z-index:1;margin-top:12px;color:#a6a6aa;letter-spacing:3px;font-size:12px}.card,.chat-panel{margin-top:16px;padding:22px;border:1px solid var(--line);border-radius:20px;background:rgba(13,13,15,.96)}h2{margin:0 0 16px;font-size:22px}label{display:block;color:#aaa;font-size:13px;margin:12px 0 7px}input{width:100%;height:50px;padding:0 14px;color:#fff;background:#070708;border:1px solid #36363b;border-radius:12px;outline:0}input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(229,9,20,.13)}.btn{width:100%;min-height:48px;margin-top:16px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:900}.btn:hover{background:var(--red2)}.btn.secondary{background:#19191c;border:1px solid #36363b}.msg{min-height:21px;margin-top:11px;font-size:13px;color:#ff7a80}.ok{color:#79e39a!important}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border-radius:999px;border:1px solid #5b1116;background:#260608;color:#ff8a8f;font-size:12px;font-weight:800}.user-list,.chat-list{display:grid;gap:9px}.user-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid #29292e;border-radius:14px;background:#080809}.row-actions button{min-height:38px;padding:0 11px;border-radius:10px;border:1px solid #34343a;color:#eee;background:#17171a}.empty{padding:22px;text-align:center;color:#777;border:1px dashed #303035;border-radius:14px}.note{margin-top:12px;color:#777;font-size:12px;line-height:1.8}.chat-list{max-height:320px;overflow:auto;padding:12px;border:1px solid #242429;border-radius:14px;background:#0a0a0c}.chat-message{max-width:80%;padding:10px 12px;border-radius:12px;border:1px solid #2a2a2f;background:#121316}.chat-message.mine{margin-inline-start:auto;border-color:#5b1116;background:#170d0f}.chat-meta{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;font-size:11px;color:#9a9a9f}.chat-text{line-height:1.6;word-break:break-word}.chat-form{display:flex;gap:8px;margin-top:12px}.chat-form input{flex:1}.chat-form .btn{width:auto;min-width:120px;margin:0}@media(max-width:520px){.page{padding:10px}.card,.chat-panel{padding:17px}.user-row{align-items:flex-start;flex-direction:column}.chat-form{flex-direction:column}.chat-form .btn{width:100%}}
</style></head>
<body><main class="page">
<section id="loginScreen"><div class="brand-card"><img class="logo" src="https://firaspalestine4-pixel.github.io/F0/logo.png" alt="شعار قطاع الطرق"><div class="tag">PRIVATE ACCESS • قطاع الطرق</div></div><div class="card"><h2>تسجيل الدخول</h2><form id="loginForm"><label for="username">اسم المستخدم</label><input id="username" autocomplete="username" required placeholder="اسم المستخدم"><label for="password">كلمة السر</label><input id="password" type="password" autocomplete="current-password" required placeholder="كلمة السر"><button class="btn" id="loginBtn" type="submit">دخول</button></form><div id="loginMsg" class="msg" aria-live="polite"></div><div class="note">الوصول مخصص للحسابات التي ينشئها مدير الموقع.</div></div></section>
<section id="adminScreen" class="hidden"><div class="brand-card"><img class="logo" src="https://firaspalestine4-pixel.github.io/F0/logo.png" alt="شعار قطاع الطرق"><div class="tag">لوحة الإدارة • F0</div></div><div class="card"><div class="top"><h2>إضافة عضو</h2><span class="badge">ADMIN</span></div><form id="addUserForm"><label for="newUsername">اسم المستخدم</label><input id="newUsername" required placeholder="مثال: member01"><label for="newPassword">كلمة السر</label><input id="newPassword" type="password" required minlength="6" placeholder="كلمة السر التي تحددها له"><button class="btn" type="submit">+ إنشاء الحساب</button></form><div id="addMsg" class="msg"></div></div><div class="card"><div class="top"><h2>الأعضاء</h2><span id="count" class="badge">0</span></div><div id="users" class="user-list"></div><button id="logoutAdmin" class="btn secondary" type="button">تسجيل الخروج</button></div><div class="chat-panel"><div class="top"><h2>الدردشة</h2><span class="badge">LIVE</span></div><div id="adminChatList" class="chat-list"></div><div id="adminChatMsg" class="msg"></div><form id="adminChatForm" class="chat-form"><input id="adminChatInput" maxlength="500" placeholder="اكتب رسالتك هنا..." autocomplete="off"><button class="btn secondary" type="submit">إرسال</button></form></div></section>
<section id="memberScreen" class="hidden"><div class="brand-card"><img class="logo" src="https://firaspalestine4-pixel.github.io/F0/logo.png" alt="شعار قطاع الطرق"><div class="tag">تم تسجيل الدخول • F0</div></div><div class="card"><div class="top"><h2>أهلًا، <span id="memberName"></span></h2><span class="badge">MEMBER</span></div><p style="color:#aaa;line-height:1.9">تم تسجيل دخولك بنجاح إلى موقع قطاع الطرق.</p><button id="logoutMember" class="btn secondary" type="button">تسجيل الخروج</button></div><div class="chat-panel"><div class="top"><h2>الدردشة</h2><span class="badge">LIVE</span></div><div id="memberChatList" class="chat-list"></div><div id="memberChatMsg" class="msg"></div><form id="memberChatForm" class="chat-form"><input id="memberChatInput" maxlength="500" placeholder="اكتب رسالتك هنا..." autocomplete="off"><button class="btn secondary" type="submit">إرسال</button></form></div></section>
</main>
<script type="module">
import{initializeApp,getApps}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";import{getFirestore,doc,getDoc,setDoc,collection,query,orderBy,onSnapshot,deleteDoc,serverTimestamp,addDoc}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyB2ExGl9s62nbpFxmk0FdpQVbHqWbV39Xc",authDomain:"feras-f0.firebaseapp.com",projectId:"feras-f0",storageBucket:"feras-f0.firebasestorage.app",messagingSenderId:"384142404801",appId:"1:384142404801:web:48317d7b4ba66a7f133840",measurementId:"G-LRDENZRT6G"};const configured=!firebaseConfig.apiKey.startsWith("PASTE_")&&!firebaseConfig.projectId.startsWith("PASTE_");const $=id=>document.getElementById(id),screens=["loginScreen","adminScreen","memberScreen"];const show=id=>screens.forEach(x=>$(x).classList.toggle("hidden",x!==id));const toEmail=u=>`${u.trim().toLowerCase()}@f0-login.local`;let app,auth,db,secondaryAuth,unsubscribeUsers=null,unsubscribeChat=null,currentProfile=null;const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const msg=(e,t,ok=false)=>{e.textContent=t;e.className="msg"+(ok?" ok":"")};const getProfile=async uid=>{const s=await getDoc(doc(db,"users",uid));return s.exists()?s.data():null};
function renderUsers(){const box=$("users"),q=query(collection(db,"users"),orderBy("createdAt","desc"));if(unsubscribeUsers)unsubscribeUsers();unsubscribeUsers=onSnapshot(q,s=>{$("count").textContent=s.size;const rows=s.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.username!=="F0");box.innerHTML=rows.length?rows.map(u=>`<div class="user-row"><strong>${escapeHtml(u.username||"—")}</strong><div class="row-actions"><button type="button" data-remove="${escapeHtml(u.id)}">إزالة الوصول</button></div></div>`).join(""):"<div class=empty>لا توجد حسابات أعضاء بعد.</div>";box.querySelectorAll("[data-remove]").forEach(b=>b.onclick=async()=>{if(confirm("إزالة وصول هذا العضو؟"))try{await deleteDoc(doc(db,"users",b.dataset.remove))}catch(e){alert(e.message)}})},e=>msg($("addMsg"),"تعذر تحميل الأعضاء: "+e.message))}
function renderChat(){if(!currentProfile||!auth.currentUser)return;const list=$(currentProfile.role==="admin"?"adminChatList":"memberChatList");if(unsubscribeChat)unsubscribeChat();unsubscribeChat=onSnapshot(query(collection(db,"chat"),orderBy("createdAt","asc")),s=>{list.innerHTML=s.size?[...s.docs].map(d=>{const m=d.data();return`<div class="chat-message ${m.uid===auth.currentUser.uid?"mine":""}"><div class="chat-meta"><strong>${escapeHtml(m.username||"عضو")}</strong><span>${m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"}):""}</span></div><div class="chat-text">${escapeHtml(m.text||"")}</div></div>`}).join(""):"<div class=empty>لا توجد رسائل بعد.</div>";list.scrollTop=list.scrollHeight},()=>{list.innerHTML="<div class=empty>تعذر تحميل الدردشة. تحقق من قواعد Firestore.</div>"})}
async function sendChat(formId,inputId,errorId){const input=$(inputId),text=input.value.trim();if(!text||!currentProfile||!auth.currentUser)return;try{await addDoc(collection(db,"chat"),{uid:auth.currentUser.uid,username:currentProfile.username||"عضو",role:currentProfile.role||"member",text,createdAt:serverTimestamp()});input.value="";msg($(errorId),"")}catch(e){msg($(errorId),"تعذر الإرسال: صلاحيات Firestore تمنع الكتابة في chat.")}}
async function login(u,p){const c=await signInWithEmailAndPassword(auth,toEmail(u),p),profile=await getProfile(c.user.uid);if(!profile){await signOut(auth);throw Error("inactive")}currentProfile=profile;if(profile.role==="admin"){show("adminScreen");renderUsers()}else{$("memberName").textContent=profile.username||"";show("memberScreen")}renderChat()}
async function createMember(u,p){if(!/^[A-Za-z0-9_.-]{3,24}$/.test(u)||u.toLowerCase()==="f0"||p.length<6)throw Error("بيانات الحساب غير صالحة.");const sa=getApps().find(a=>a.name==="MemberCreator")||initializeApp(firebaseConfig,"MemberCreator");secondaryAuth=getAuth(sa);const c=await createUserWithEmailAndPassword(secondaryAuth,toEmail(u),p);await setDoc(doc(db,"users",c.user.uid),{username:u,role:"member",createdAt:serverTimestamp()});await signOut(secondaryAuth)}
$("loginForm").onsubmit=async e=>{e.preventDefault();try{await login($("username").value,$("password").value);msg($("loginMsg"),"")}catch{msg($("loginMsg"),"بيانات الدخول غير صحيحة أو الحساب غير مفعّل.")}};$("addUserForm").onsubmit=async e=>{e.preventDefault();try{await createMember($("newUsername").value.trim(),$("newPassword").value);$("newUsername").value="";$("newPassword").value="";msg($("addMsg"),"تم إنشاء الحساب بنجاح.",true)}catch(e){msg($("addMsg"),e.message)}};$("adminChatForm").onsubmit=e=>{e.preventDefault();sendChat("adminChatForm","adminChatInput","adminChatMsg")};$("memberChatForm").onsubmit=e=>{e.preventDefault();sendChat("memberChatForm","memberChatInput","memberChatMsg")};async function logout(){if(unsubscribeUsers)unsubscribeUsers();if(unsubscribeChat)unsubscribeChat();currentProfile=null;await signOut(auth);show("loginScreen")}$("logoutAdmin").onclick=logout;$("logoutMember").onclick=logout;
if(configured){app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,async u=>{if(!u){currentProfile=null;show("loginScreen");return}try{currentProfile=await getProfile(u.uid);if(!currentProfile)return signOut(auth);if(currentProfile.role==="admin"){show("adminScreen");renderUsers()}else{$("memberName").textContent=currentProfile.username||"";show("memberScreen")}renderChat()}catch{await signOut(auth)}})}else show("loginScreen");
</script></body></html>
