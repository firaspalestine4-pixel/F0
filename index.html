<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="F0 — قطاع الطرق">
  <title>F0 | قطاع الطرق</title>
  <link rel="icon" href="https://firaspalestine4-pixel.github.io/F0/logo.png">
  <style>
    :root{--red:#e50914;--bg:#050505;--panel:#0d0d0f;--line:#29292d;--text:#f5f5f5}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.page{width:min(760px,100%);margin:auto;padding:18px}.brand-card{position:relative;overflow:hidden;text-align:center;padding:14px 10px 22px;border:1px solid #26262a;border-radius:26px;background:linear-gradient(180deg,rgba(20,2,4,.94),rgba(7,7,8,.97));box-shadow:0 20px 70px rgba(0,0,0,.45)}.logo{position:relative;z-index:1;width:100%;max-width:560px;height:auto;display:block;margin:0 auto;border:0;border-radius:0;object-fit:contain;object-position:center;box-shadow:none;background:transparent}.tag{margin-top:12px;color:#a6a6aa;letter-spacing:3px;font-size:12px}.card{margin-top:16px;padding:22px;border:1px solid var(--line);border-radius:20px;background:rgba(13,13,15,.96)}h2{margin:0 0 16px;font-size:22px}label{display:block;color:#aaa;font-size:13px;margin:12px 0 7px}input{width:100%;height:50px;padding:0 14px;color:#fff;background:#070708;border:1px solid #36363b;border-radius:12px;outline:0}.btn{width:100%;min-height:48px;margin-top:16px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:900}.btn.secondary{background:#19191c;border:1px solid #36363b}.msg{min-height:21px;margin-top:11px;font-size:13px;color:#ff7a80}.ok{color:#79e39a!important}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border-radius:999px;border:1px solid #5b1116;background:#260608;color:#ff8a8f;font-size:12px;font-weight:800}.user-list{display:grid;gap:9px}.user-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid #29292e;border-radius:14px;background:#080809}.row-actions button{min-height:38px;padding:0 11px;border-radius:10px;border:1px solid #34343a;color:#eee;background:#17171a}.note{margin-top:12px;color:#777;font-size:12px;line-height:1.8}@media(max-width:520px){.page{padding:10px}.card{padding:17px}.user-row{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<main class="page">
  <section id="loginScreen"><div class="brand-card"><img class="logo" src="https://firaspalestine4-pixel.github.io/F0/logo.png" alt="شعار قطاع الطرق"><div class="tag">PRIVATE ACCESS • قطاع الطرق</div></div><div class="card"><h2>تسجيل الدخول</h2><form id="loginForm"><label for="username">اسم المستخدم</label><input id="username" autocomplete="username" required placeholder="اسم المستخدم"><label for="password">كلمة السر</label><input id="password" type="password" autocomplete="current-password" required placeholder="كلمة السر"><button class="btn" id="loginBtn" type="submit">دخول</button></form><div id="loginMsg" class="msg" aria-live="polite"></div><div class="note">الوصول مخصص للحسابات التي ينشئها مدير الموقع.</div></div></section>
  <section id="adminScreen" class="hidden"><div class="brand-card"><img class="logo" src="https://firaspalestine4-pixel.github.io/F0/logo.png" alt="شعار قطاع الطرق"><div class="tag">لوحة الإدارة • F0</div></div><div class="card"><div class="top"><h2>إضافة عضو</h2><span class="badge">ADMIN</span></div><form id="addUserForm"><label for="newUsername">اسم المستخدم</label><input id="newUsername" required placeholder="مثال: member01" autocomplete="off"><label for="newPassword">كلمة السر</label><input id="newPassword" type="password" required minlength="6" placeholder="كلمة السر التي تحددها له" autocomplete="new-password"><button class="btn" type="submit">+ إنشاء الحساب</button></form><div id="addMsg" class="msg" aria-live="polite"></div></div><div class="card"><div class="top"><h2>الأعضاء</h2><span id="count" class="badge">0</span></div><div id="users" class="user-list"></div><button id="logoutAdmin" class="btn secondary" type="button">تسجيل الخروج</button></div></section>
  <section id="memberScreen" class="hidden"><div class="brand-card"><img class="logo" src="https://firaspalestine4-pixel.github.io/F0/logo.png" alt="شعار قطاع الطرق"><div class="tag">تم تسجيل الدخول • F0</div></div><div class="card"><div class="top"><h2>أهلًا، <span id="memberName"></span></h2><span class="badge">MEMBER</span></div><p style="color:#aaa;line-height:1.9">تم تسجيل دخولك بنجاح إلى موقع قطاع الطرق.</p><button id="logoutMember" class="btn secondary" type="button">تسجيل الخروج</button></div></section>
</main>
<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, collection, query, orderBy, onSnapshot, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  const firebaseConfig={apiKey:"AIzaSyB2ExGl9s62nbpFxmk0FdpQVbHqWbV39Xc",authDomain:"feras-f0.firebaseapp.com",projectId:"feras-f0",storageBucket:"feras-f0.firebasestorage.app",messagingSenderId:"384142404801",appId:"1:384142404801:web:48317d7b4ba66a7f133840",measurementId:"G-LRDENZRT6G"};
  const configured=!firebaseConfig.apiKey.startsWith("PASTE_")&&!firebaseConfig.projectId.startsWith("PASTE_");
  const $=id=>document.getElementById(id), screens=["loginScreen","adminScreen","memberScreen"];
  const show=id=>screens.forEach(x=>$(x).classList.toggle("hidden",x!==id));
  const toEmail=username=>`${username.trim().toLowerCase()}@f0-login.local`;
  let app,auth,db,secondaryAuth,unsubscribeUsers=null;
  const msg=(el,text,ok=false)=>{el.textContent=text;el.className="msg"+(ok?" ok":"")};
  const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function getProfile(uid){const snap=await getDoc(doc(db,"users",uid));return snap.exists()?snap.data():null}
  function renderUsers(){const box=$("users"),q=query(collection(db,"users"),orderBy("createdAt","desc"));if(unsubscribeUsers)unsubscribeUsers();unsubscribeUsers=onSnapshot(q,snap=>{ $("count").textContent=String(snap.size);const rows=snap.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.username!=="F0");box.innerHTML=rows.length?rows.map(u=>`<div class="user-row"><strong>${escapeHtml(u.username||"—")}</strong><button type="button" data-remove="${escapeHtml(u.id)}">إزالة الوصول</button></div>`).join(""):"<div>لا توجد حسابات أعضاء بعد.</div>";box.querySelectorAll("[data-remove]").forEach(btn=>btn.addEventListener("click",async()=>{if(confirm("إزالة وصول هذا العضو؟"))try{await deleteDoc(doc(db,"users",btn.dataset.remove))}catch(e){alert("تعذر إزالة الوصول: "+e.message)}}))},e=>msg($("addMsg"),"تعذر تحميل الأعضاء: "+e.message))}
  async function login(username,password){const cred=await signInWithEmailAndPassword(auth,toEmail(username),password),profile=await getProfile(cred.user.uid);if(!profile){await signOut(auth);throw Error("inactive")};if(profile.role==="admin"){show("adminScreen");renderUsers()}else{$("memberName").textContent=profile.username;show("memberScreen")}}
  async function createMember(username,password){if(!/^[A-Za-z0-9_.-]{3,24}$/.test(username)||username.toLowerCase()==="f0")throw Error("اسم المستخدم غير صالح.");if(password.length<6)throw Error("كلمة السر يجب أن تكون 6 أحرف على الأقل.");if(!secondaryAuth){const secondaryApp=getApps().find(a=>a.name==="MemberCreator")||initializeApp(firebaseConfig,"MemberCreator");secondaryAuth=getAuth(secondaryApp)}const cred=await createUserWithEmailAndPassword(secondaryAuth,toEmail(username),password);await setDoc(doc(db,"users",cred.user.uid),{username,role:"member",createdAt:serverTimestamp()});await signOut(secondaryAuth)}
  async function logout(){if(unsubscribeUsers){unsubscribeUsers();unsubscribeUsers=null}await signOut(auth);show("loginScreen")}
  $("loginForm").addEventListener("submit",async e=>{e.preventDefault();if(!configured)return msg($("loginMsg"),"الموقع غير مربوط بـ Firebase بعد.");$("loginBtn").disabled=true;try{await login($("username").value,$("password").value);msg($("loginMsg"),"")}catch{msg($("loginMsg"),"بيانات الدخول غير صحيحة أو الحساب غير مفعّل.")}finally{$("loginBtn").disabled=false}});
  $("addUserForm").addEventListener("submit",async e=>{e.preventDefault();try{await createMember($("newUsername").value.trim(),$("newPassword").value);$("newUsername").value="";$("newPassword").value="";msg($("addMsg"),"تم إنشاء الحساب بنجاح.",true)}catch(err){msg($("addMsg"),err.message||"تعذر إنشاء الحساب.")}});
  $("logoutAdmin").addEventListener("click",logout);$("logoutMember").addEventListener("click",logout);
  if(configured){app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,async user=>{if(!user)return show("loginScreen");try{const p=await getProfile(user.uid);if(!p)return signOut(auth);if(p.role==="admin"){show("adminScreen");renderUsers()}else{$("memberName").textContent=p.username||"";show("memberScreen")}}catch{await signOut(auth)}})}else show("loginScreen");
</script>
</body>
</html>
