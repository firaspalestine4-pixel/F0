<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <title>F0</title>
  <style>
    :root {
      --bg: #050505;
      --panel: rgba(26, 26, 30, 0.96);
      --line: rgba(255,255,255,0.18);
      --text: #f5f5f5;
      --muted: #b7bcc8;
      --danger: #e50914;
      --blue: #2b6df5;
      --green: #30c67d;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .screen {
      width: min(600px, 100%);
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0,0,0,0.35);
    }
    .hidden { display: none !important; }
    #loginScreen {
      padding: 24px;
    }
    .brand {
      text-align: center;
      font-size: 2.6rem;
      font-weight: 800;
      margin-bottom: 18px;
    }
    .field {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      padding: 14px 16px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }
    .primary {
      background: linear-gradient(135deg, var(--blue), #1b55d6);
    }
    .danger {
      background: linear-gradient(135deg, var(--danger), #b8121e);
    }
    .status {
      min-height: 22px;
      margin-top: 12px;
      color: #ff9aa2;
      text-align: center;
      font-size: 0.96rem;
    }
    #chatScreen {
      padding: 18px;
      background: #0d1014;
    }
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 4px 0 16px;
    }
    .live {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      background: rgba(229, 9, 20, 0.14);
      color: #ff5d68;
      border: 1px solid rgba(229, 9, 20, 0.7);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .chat-title {
      font-size: 2rem;
      margin: 0;
    }
    .messages {
      min-height: 260px;
      max-height: 360px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      padding: 12px;
      margin-bottom: 12px;
    }
    .msg {
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      max-width: 82%;
      word-break: break-word;
      line-height: 1.6;
    }
    .msg.me {
      background: rgba(43, 109, 245, 0.28);
      margin-left: auto;
      border-top-right-radius: 4px;
    }
    .msg.other {
      background: rgba(255,255,255,0.06);
      margin-right: auto;
      border-top-left-radius: 4px;
    }
    .composer {
      display: flex;
      gap: 10px;
    }
    .composer input {
      flex: 1;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
    }
    .logout {
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div id="loginScreen" class="screen">
    <div style="padding:24px;">
      <div class="brand">F0</div>
      <input id="username" class="field" type="text" placeholder="اسم المستخدم" />
      <input id="password" class="field" type="password" placeholder="كلمة المرور" />
      <button id="loginBtn" class="primary">تسجيل الدخول</button>
      <div id="loginStatus" class="status"></div>
    </div>
  </div>

  <div id="chatScreen" class="screen hidden">
    <div style="padding:18px;">
      <div class="chat-header">
        <span class="live">LIVE</span>
        <h1 class="chat-title">الدردشة</h1>
      </div>

      <div id="messages" class="messages"></div>

      <div class="composer">
        <input id="chatInput" type="text" maxlength="500" placeholder="اكتب رسالة..." />
        <button id="sendBtn" class="primary" style="width:120px;">إرسال</button>
      </div>

      <button id="logoutBtn" class="logout danger">تسجيل الخروج</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      addDoc,
      deleteDoc,
      getDocs,
      query,
      orderBy,
      onSnapshot
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyB2ExGl9s62nbpFxmk0FdpQVbHqWbV39Xc',
      authDomain: 'feras-f0.firebaseapp.com',
      projectId: 'feras-f0',
      storageBucket: 'feras-f0.firebasestorage.app',
      messagingSenderId: '386083766886',
      appId: '1:386083766886:web:4bbd17a19fa1b1ac8f32aa'
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginScreen = document.getElementById('loginScreen');
    const chatScreen = document.getElementById('chatScreen');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const loginStatus = document.getElementById('loginStatus');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const messagesBox = document.getElementById('messages');

    let currentProfile = null;
    let unsubscribeChat = null;

    function toEmail(username) {
      return `${String(username).trim()}@f0.local`;
    }

    function showLogin() {
      loginScreen.classList.remove('hidden');
      chatScreen.classList.add('hidden');
    }

    function showChat() {
      loginScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');
    }

    async function getProfile(uid) {
      const snap = await getDoc(doc(db, 'users', uid));
      return snap.exists() ? snap.data() : null;
    }

    async function clearChatAutomatically() {
      const snapshot = await getDocs(collection(db, 'chat'));
      await Promise.all(snapshot.docs.map((docSnap) => deleteDoc(docSnap.ref)));
    }

    function renderChat(messages) {
      messagesBox.innerHTML = '';

      if (!messages.length) {
        const empty = document.createElement('div');
        empty.className = 'msg other';
        empty.textContent = 'لا توجد رسائل في الدردشة';
        empty.style.maxWidth = '100%';
        empty.style.textAlign = 'center';
        messagesBox.appendChild(empty);
        return;
      }

      messages.forEach((message) => {
        const el = document.createElement('div');
        const mine = message.uid === auth.currentUser?.uid;
        el.className = `msg ${mine ? 'me' : 'other'}`;
        el.textContent = message.text || '';
        messagesBox.appendChild(el);
      });

      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    function attachChatListener() {
      if (unsubscribeChat) unsubscribeChat();

      const q = query(collection(db, 'chat'), orderBy('createdAt', 'asc'));
      unsubscribeChat = onSnapshot(q, (snapshot) => {
        const items = snapshot.docs.map((docSnap) => ({ id: docSnap.id, ...docSnap.data() }));
        renderChat(items);
      }, (error) => {
        console.error('chat listener error:', error);
      });
    }

    loginBtn.addEventListener('click', async () => {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      if (!username || !password) {
        loginStatus.textContent = 'أدخل اسم المستخدم وكلمة المرور';
        return;
      }

      try {
        loginStatus.textContent = 'جاري تسجيل الدخول...';

        const cred = await signInWithEmailAndPassword(auth, toEmail(username), password);
        const profile = await getProfile(cred.user.uid);

        if (!profile) {
          await signOut(auth);
          throw new Error('الحساب غير مفعّل');
        }

        currentProfile = profile;
        await clearChatAutomatically();
        showChat();
        attachChatListener();
        loginStatus.textContent = '';
      } catch (error) {
        loginStatus.textContent = error.message || 'فشل تسجيل الدخول';
      }
    });

    sendBtn.addEventListener('click', async () => {
      const text = chatInput.value.trim();
      if (!text || !auth.currentUser) return;

      try {
        await addDoc(collection(db, 'chat'), {
          uid: auth.currentUser.uid,
          text,
          createdAt: Date.now()
        });
        chatInput.value = '';
      } catch (error) {
        console.error('send error:', error);
      }
    });

    chatInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        sendBtn.click();
      }
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (error) {
        console.error('logout error:', error);
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        currentProfile = null;
        showLogin();
        loginStatus.textContent = '';
        return;
      }

      try {
        currentProfile = await getProfile(user.uid);
        if (!currentProfile) {
          await signOut(auth);
          showLogin();
          loginStatus.textContent = 'الحساب غير مفعّل';
          return;
        }

        await clearChatAutomatically();
        showChat();
        attachChatListener();
      } catch (error) {
        console.error('auth state error:', error);
      }
    });
  </script>
</body>
</html>
